[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicorn-benchmark"
version = "0.1.0"
description = "UniCoRn: a benchmark for unified compression and reranking"
readme = "README.md"
requires-python = "==3.12.*"
keywords = ["context-compression", "reranking", "retrieval-augmented-generation", "benchmark"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=2.18",
    "pyarrow>=14",
    "huggingface-hub>=0.23",
    "tqdm",
    "transformers>=4.36,<5.0",
]

[project.urls]
Repository = "https://github.com/byunsj/unicorn-benchmark"
Dataset = "https://huggingface.co/datasets/unicorn-rerank/unicorn-benchmark"

# The base install only reads data and drives the pipeline. Everything that needs
# a GPU lives in an extra, so the benchmark can be inspected without one.
[project.optional-dependencies]
compressors = [
    "torch",
    "torchvision",
    "sentence-transformers>=2.2.0",
    "accelerate>=0.20.0",
    "peft>=0.10.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.0",
    "llmlingua>=0.2.0",
    # Sentence splitters: nltk for English, the others for the CJK and
    # multilingual datasets. Extractive baselines segment before scoring.
    "nltk>=3.8",
    "spacy>=3.0",
    "fast-bunkai>=0.1.1",
    "wtpsplit>=2.2.0",
    "xx_sent_ud_sm @ https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0-py3-none-any.whl",
]
# Covers both the generator and the judge — they share one vLLM engine.
generate = ["vllm~=0.19.0", "xgrammar<=0.2.3", "tiktoken>=0.5.0", "psutil", "ninja"]
# The system tier talks to a locally served agent over the OpenAI protocol.
agent = ["openai>=1.0"]
gpu = ["unicorn-benchmark[compressors,generate,agent]"]
dev = ["pytest", "ruff"]
flash = [
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_x86_64.whl",
]

[project.scripts]
unicorn = "unicorn.run:main"
unicorn-system = "unicorn.system.run:main"

[tool.setuptools.packages.find]
include = ["unicorn*"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Vendored upstream architecture, kept byte-identical so it can be diffed.
extend-exclude = ["unicorn/models/qwen3_5"]

[tool.ruff.lint]
# Class-level config dicts are how transformers models declare their metadata.
ignore = ["RUF012"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
